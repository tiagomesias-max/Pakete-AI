<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaketeAI 4.0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://js.puter.com/v2/"></script>
  
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-panel: #151c2c;
      --bg-bubble-ai: #1e293b;
      --bg-bubble-user: #2563eb;
      --accent: #3b82f6;
      --accent-hover: #1d4ed8;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BARRA SUPERIOR */
    header {
      background: var(--bg-panel);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: var(--accent);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status {
      font-size: 0.75rem;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      color: var(--text-primary);
      border-color: var(--accent);
      background: var(--bg-bubble-ai);
    }

    /* ÁREA DE CONVERSACIÓN */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 85%;
    }

    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .user .msg-avatar {
      background: var(--accent);
      color: white;
    }

    .ai .msg-avatar {
      background: #334155;
      color: #38bdf8;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .user .msg-bubble {
      background: var(--bg-bubble-user);
      color: white;
      border-top-right-radius: 2px;
    }

    .ai .msg-bubble {
      background: var(--bg-bubble-ai);
      color: var(--text-primary);
      border-top-left-radius: 2px;
      border: 1px solid var(--border);
    }

    .msg-bubble p {
      margin-bottom: 8px;
    }

    .msg-bubble p:last-child {
      margin-bottom: 0;
    }

    .msg-bubble pre {
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid var(--border);
    }

    .msg-bubble code {
      font-family: monospace;
      font-size: 0.85rem;
    }

    .msg-meta {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .user .msg-meta {
      text-align: right;
    }

    /* BOTONES DE SUGERENCIA */
    .chips-wrapper {
      display: flex;
      gap: 8px;
      padding: 0 20px 10px;
      overflow-x: auto;
    }

    .chip {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    /* ENTRADA DE TEXTO */
    footer {
      background: var(--bg-panel);
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .input-container {
      display: flex;
      gap: 10px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      align-items: flex-end;
    }

    .input-container:focus-within {
      border-color: var(--accent);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.95rem;
      resize: none;
      max-height: 100px;
      height: 24px;
    }

    .btn-send {
      background: var(--accent);
      color: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-send:hover {
      background: var(--accent-hover);
    }

    /* ANIMACIÓN CARGANDO */
    .dots-loader {
      display: flex;
      gap: 4px;
      padding: 4px;
    }

    .dots-loader div {
      width: 6px;
      height: 6px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }

    .dots-loader div:nth-child(2) { animation-delay: 0.2s; }
    .dots-loader div:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      from { opacity: 0.3; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-bolt"></i></div>
      <div>
        <div class="brand-title">PaketeAI</div>
        <div class="status"><span class="dot"></span> En línea</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-icon" onclick="resetChat()" title="Borrar chat"><i class="fa-solid fa-trash"></i></button>
    </div>
  </header>

  <main id="chat-box">
    <div class="msg-row ai">
      <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
      <div class="msg-content">
        <div class="msg-bubble">
          ¡Hola! Soy **PaketeAI**. Sistema restablecido con sincronización garantizada. ¿En qué trabajamos hoy?
        </div>
      </div>
    </div>
  </main>

  <div class="chips-wrapper">
    <div class="chip" onclick="quickSend('Resumen sobre la Revolución Industrial')">📚 Resumen escolar</div>
    <div class="chip" onclick="quickSend('Escribe un código HTML/CSS sencillo')">💻 Ejemplo de código</div>
    <div class="chip" onclick="quickSend('Consejos para estudiar mejor')">🧠 Tips de estudio</div>
  </div>

  <footer>
    <div class="input-container">
      <textarea id="user-input" placeholder="Escribe un mensaje..." rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="btn-send" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </footer>

  <script>
    const chatBox = document.getElementById('chat-box');
    const inputArea = document.getElementById('user-input');

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    }

    function quickSend(text) {
      inputArea.value = text;
      sendMsg();
    }

    function parseText(raw) {
      const str = String(raw || '');
      if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
        try { return marked.parse(str); } catch(e) {}
      }
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
    }

    async function sendMsg() {
      const text = inputArea.value.trim();
      if (!text) return;

      inputArea.value = '';
      appendMsg('user', text);

      const loaderId = showLoader();

      try {
        const response = await fetchAI(text);
        removeLoader(loaderId);
        appendMsg('ai', response.content, response.source);
      } catch (err) {
        removeLoader(loaderId);
        appendMsg('ai', '⚠️ No se pudo obtener respuesta del servidor. Inténtalo de nuevo en unos segundos.');
      }
    }

    async function fetchAI(prompt) {
      // Motor 1: Pollinations GET
      try {
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai&cache=${Date.now()}`);
        if (res.ok) {
          const txt = await res.text();
          if (txt && txt.trim() && !txt.includes('<!DOCTYPE html>')) {
            return { content: txt.trim(), source: 'Pollinations Cloud' };
          }
        }
      } catch (e) {}

      // Motor 2: Pollinations POST
      try {
        const res = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [{ role: 'user', content: prompt }],
            model: 'openai'
          })
        });
        if (res.ok) {
          const txt = await res.text();
          if (txt && txt.trim() && !txt.includes('<!DOCTYPE html>')) {
            return { content: txt.trim(), source: 'Cloud Engine' };
          }
        }
      } catch (e) {}

      // Motor 3: Puter AI
      if (typeof puter !== 'undefined' && puter.ai) {
        try {
          const res = await puter.ai.chat(prompt);
          let txt = '';
          if (typeof res === 'string') txt = res;
          else if (res?.message?.content) txt = res.message.content;
          else if (res?.text) txt = res.text;

          if (txt && txt.trim()) return { content: txt.trim(), source: 'Puter Engine' };
        } catch (e) {}
      }

      throw new Error('Todos los motores fallaron');
    }

    function appendMsg(role, text, source = '') {
      try {
        const row = document.createElement('div');
        row.className = `msg-row ${role}`;

        const avatar = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';
        const parsed = role === 'ai' ? parseText(text) : String(text || '');

        row.innerHTML = `
          <div class="msg-avatar">${avatar}</div>
          <div class="msg-content">
            <div class="msg-bubble">${parsed}</div>
            ${source ? `<div class="msg-meta">${source}</div>` : ''}
          </div>
        `;

        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (e) {
        console.error("Error mostrando mensaje:", e);
      }
    }

    function showLoader() {
      const id = 'loader-' + Date.now();
      const row = document.createElement('div');
      row.className = 'msg-row ai';
      row.id = id;
      row.innerHTML = `
        <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
        <div class="msg-content">
          <div class="msg-bubble">
            <div class="dots-loader"><div></div><div></div><div></div></div>
          </div>
        </div>
      `;
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
      return id;
    }

    function removeLoader(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function resetChat() {
      chatBox.innerHTML = `
        <div class="msg-row ai">
          <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
          <div class="msg-content">
            <div class="msg-bubble">Conversación reiniciada. ¿En qué puedo ayudarte?</div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
